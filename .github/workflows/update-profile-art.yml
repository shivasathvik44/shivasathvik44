name: Update GitHub Profile Art

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Refresh contribution data
        env:
          GH_PROFILE_USER: shivasathvik44
        run: python scripts/fetch_contributions.py

      - name: Generate contribution graph
        run: python scripts/render_heatmap_svg.py

      - name: Generate statistics card
        run: python scripts/render_stats_svg.py

      - name: Commit updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile activity"
            git push
          fi
